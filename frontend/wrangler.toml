# Cloudflare Workers config for the SolidStart (Nitro v3 cloudflare_module) build.
# Nitro generates .output/server/wrangler.json (main + assets binding) at build time
# and redirects wrangler to it, so `main`/`assets` are NOT set here — only the fields
# Nitro merges in: the worker name, compat date, and Node compatibility flag.
name = "meaningful"
compatibility_date = "2026-07-07"
compatibility_flags = ["nodejs_compat"]

[vars]
BACKEND_URL = "https://api.meaningfuldictionary.com"